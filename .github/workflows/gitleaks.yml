# Repite en GitHub la búsqueda de secretos que el servidor hace con sus hooks.
# Usa las reglas por defecto de gitleaks: las de datos de la casa viven solo en
# el servidor, porque contienen valores reales.
#
# No usa gitleaks-action: en la primera subida de un repositorio revisaba desde
# "el padre del primer commit", que no existe, y terminaba sin revisar nada.
# Aquí se instala la misma versión que en el servidor, con su checksum fijado,
# y se revisa siempre todo el historial.
name: gitleaks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 del tar.gz oficial linux_x64, comprobado con el checksums.txt de la release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
          persist-credentials: false # el token no se queda en .git/config

      - name: Instalar gitleaks (versión y checksum fijados)
        shell: bash
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks

      - name: Revisar todo el historial
        shell: bash # bash con pipefail: si gitleaks encuentra algo, el paso falla
        run: |
          ./gitleaks git --redact --no-banner -v . 2>&1 | tee gitleaks.log
          # gitleaks puede terminar sin error aunque git falle y no revise nada:
          # se exige que haya revisado al menos todos los commits de la rama.
          revisados=$(grep -oE '[0-9]+ commits scanned' gitleaks.log | grep -oE '^[0-9]+')
          total=$(git rev-list --count HEAD)
          echo "Commits revisados: ${revisados:-0} de ${total}"
          test "${revisados:-0}" -ge "${total}"
