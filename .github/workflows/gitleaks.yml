# Repite en GitHub la búsqueda de secretos que el servidor hace con sus hooks.
# Usa las reglas por defecto de gitleaks: las de datos de la casa viven solo en
# el servidor, porque contienen valores reales.
# Acciones fijadas por commit (con su versión en el comentario) para que una
# etiqueta movida no cambie lo que se ejecuta.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
