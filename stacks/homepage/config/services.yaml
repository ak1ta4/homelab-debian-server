# Homelab: servicios. Los enlaces usan homelab.home.arpa (AdGuard);
# los puntos de estado y los datos, la red de Docker "panel".
- Multimedia:
    - Jellyfin:
        icon: jellyfin.png
        href: http://homelab.home.arpa:8096
        description: Películas y series
        siteMonitor: http://jellyfin:8096
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_FILE_JELLYFIN}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableMediaControl: false
    - Immich:
        icon: immich.png
        href: http://homelab.home.arpa:2283
        description: Fotos
        siteMonitor: http://immich_server:2283
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_FILE_IMMICH}}"
          version: 2
- Archivos:
    - Syncthing:
        icon: syncthing.png
        href: https://homelab.home.arpa:8384
        description: Copia del PC (panel solo desde el PC y la tailnet)
        siteMonitor: https://syncthing:8384
    - Carpeta de red:
        icon: mdi-folder-network-outline
        href: smb://homelab.home.arpa/pc
        description: "pc (lectura) y subidas, con Samba"
- Red:
    - AdGuard Home:
        icon: adguard-home.png
        href: http://homelab.home.arpa:3000
        description: DNS sin anuncios (panel solo desde casa)
        siteMonitor: http://adguard:3000
        widget:
          type: adguard
          url: http://adguard:3000
          username: panel
          password: "{{HOMEPAGE_FILE_ADGUARD}}"
    - Tailscale:
        icon: si-tailscale-#ebdbb2
        href: https://login.tailscale.com/admin/machines
        description: Acceso desde fuera
- Monitorización:
    - Beszel:
        icon: beszel.png
        href: http://homelab.home.arpa:8090
        description: Gráficas e historial del servidor
        siteMonitor: http://beszel:8090
    - Dozzle:
        icon: dozzle.png
        href: http://homelab.home.arpa:8080
        description: Registros de los contenedores
        siteMonitor: http://dozzle:8080
