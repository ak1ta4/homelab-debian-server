# Homelab: widgets de la cabecera.
- resources:
    label: Servidor
    cpu: true
    memory: true
    uptime: true
- resources:
    label: Sistema
    disk: /
- resources:
    label: Datos
    disk: /mnt/datos
- openmeteo:
    label: <CIUDAD>
    latitude: <LATITUD>
    longitude: <LONGITUD>
    timezone: Europe/Madrid
    units: metric
    cache: 10
- datetime:
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
