# Homelab: Immich v3.4.1. Basado en el docker-compose.yml de la versión y en
# docker-compose.rootless.yml. Los valores de este equipo están en .env.
name: immich

x-endurecido: &endurecido
  user: "${IMMICH_UID}:${IMMICH_GID}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: always

services:
  immich-server:
    <<: *endurecido
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    group_add:
      - "${SYNCTHING_GID}"  # para leer las fotos del PC
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # Fotos del PC, biblioteca externa en solo lectura.
      - /srv/datos/archivos/pc/imagenes:/mnt/pc-imagenes:ro
    env_file:
      - .env
    ports:
      # Todas las IPv4; el origen se limita en DOCKER-USER.
      - "0.0.0.0:2283:2283"
    depends_on:
      - redis
      - database
    networks:
      - default
      - panel
    healthcheck:
      disable: false

  immich-machine-learning:
    <<: *endurecido
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - ./ml-model-cache:/cache
    env_file:
      - .env
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    healthcheck:
      disable: false

  redis:
    <<: *endurecido
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    volumes:
      - ./redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    <<: *endurecido
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  panel:
    external: true  # la crea fase-5-red-panel.sh
