# Homelab: Jellyfin. Los valores de este equipo están en .env, al lado.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    user: "${JELLYFIN_UID}:${JELLYFIN_GID}"
    group_add:
      - "${RENDER_GID}"  # grupo render: VA-API con la AMD integrada
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      # Todas las IPv4 (LAN y tailnet); el origen se limita en DOCKER-USER.
      - "0.0.0.0:8096:8096/tcp"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /srv/datos/Videos
        target: /media
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
