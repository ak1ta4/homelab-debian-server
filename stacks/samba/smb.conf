# Homelab: Samba, carpeta de red (Fase 5.3). Va en /etc/samba/smb.conf.
# Copia original de Debian: smb.conf.orig-debian, al lado.
[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = homelab
   # Extensiones de Apple para la app Archivos del iPhone.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:posix_rename = yes
   fruit:nfs_aces = no
   fruit:delete_empty_adfiles = yes
   # Solo casa, tailnet y el propio servidor (UFW filtra también).
   hosts allow = 127.0.0.1 <RED_LAN_MASCARA> 100.64.0.0/255.192.0.0
   hosts deny = ALL
   server min protocol = SMB3_00
   server smb encrypt = desired
   smb ports = 445
   disable netbios = yes
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[pc]
   comment = Copia del PC (solo lectura)
   path = /srv/datos/archivos/pc
   read only = yes
   browseable = yes
   valid users = <USUARIO_WINDOWS>

[subidas]
   comment = Para subir cosas al servidor (fuera de Syncthing)
   path = /srv/datos/archivos/subidas
   read only = no
   browseable = yes
   valid users = <USUARIO_WINDOWS>
   create mask = 0640
   directory mask = 0750
